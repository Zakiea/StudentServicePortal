<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta name="viewport" content="width: device-width, initial-scale:1.0">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>


    <body>
        <header>
            <div class="container">
                <div class="icon">
                    <a href="#"><i class="fa fa-home outline" ></i></a>
                </div>
                <div class="menu">
                    <ul>
                        <li>
                            <a href="#">Courses</a>
                            <a href="#">Students</a>
                            <a href="#">Industry</a>
                            <a href="#">Study Online</a>
                            <a href="#">About Us</a>
                            <a href="#">News and Events</a></li>           
                    </ul>   
                </div>
                <div class="search">
                        <input type="text" placeholder="search...">
                    </div>
            </div>
        </header>

        <!--Help $ support form-->
       
       <div class="help_support_form"> 
            <form action="">
                <table id="help_table">
                    <tr>
                        <th><label for="username">Name</label></th>
                        <td><input type="text" name="username"><br></td>
                    </tr>
                    <tr>
                        <th><label for="student_id">Student ID</label></th>
                        <td><input type="text" pattern="" name="student_id"><br></td>
                    </tr>
                    <tr>
                        <th><label for="campus">Current Campus</label></th>
                        <td> 
                            <select name="campus-list" id="">
                                <option value="Dandenong">Dandenong</option>
                                <option value="frankston">Frankston</option>
                                <option value="berwick">Berwick</option>
                                <option value="cranbourn">Cranbourn</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th><label for="ask_us">How Can We Help</label></th>
                        <td><textarea name="ask_us" id=""></textarea></td>
                    </tr>
                
                
                
                
                </table>
                
                
            </form>
        </div>
       

    </body>

</html>
